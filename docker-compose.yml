version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_DATABASE: desafio_auth
      MYSQL_USER: appuser
      MYSQL_PASSWORD: appsecret
      MYSQL_ROOT_PASSWORD: root
    # ports:
    #   - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 20

  mongo:
    image: mongo:7
    container_name: mongo
    # ports:
    #   - "27017:27017"
    volumes:
      - mongo_data:/data/db

  # PHP-FPM do Laravel
  auth-laravel:
    build:
      context: ./backend/auth-laravel
      dockerfile: Dockerfile
    container_name: auth-laravel
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: desafio_auth
      DB_USERNAME: appuser
      DB_PASSWORD: appsecret
      SESSION_DRIVER: file
      CACHE_DRIVER: file
      QUEUE_CONNECTION: sync
      # CORS (se usar laravel-cors)
      # CORS_ALLOWED_ORIGINS: http://localhost:8080
    depends_on:
      - mysql
    volumes:
      - ./backend/auth-laravel:/var/www/html
      - /var/www/html/vendor
      - /var/www/html/storage

  # Nginx servindo o Laravel /public
  laravel-nginx:
    image: nginx:alpine
    container_name: laravel-nginx
    depends_on:
      - auth-laravel
    ports:
      - "8000:80"
    volumes:
      - ./backend/auth-laravel:/var/www/html
      - ./backend/auth-laravel/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  api-node:
    build:
      context: ./backend/api-node
      dockerfile: Dockerfile
    container_name: api-node
    environment:
      NODE_ENV: production
      PORT: 3001
      CORS_ORIGIN: http://localhost:8080
      DATABASE_URL: mysql://appuser:appsecret@mysql:3306/desafio_auth
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB: techx_audit
      JWT_SECRET: "dev-super-secret-change-me"
    depends_on:
      - mysql
      - mongo
    ports:
      - "3001:3001"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "8080:80"
    depends_on:
      - api-node
      - laravel-nginx

volumes:
  mysql_data:
  mongo_data:
